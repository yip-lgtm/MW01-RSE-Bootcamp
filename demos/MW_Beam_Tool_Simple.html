<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Beam Analysis</title>
<style>
body{font-family:sans-serif;margin:20px;background:#f0f0f0}
.container{max-width:900px;margin:auto;background:white;padding:20px;border-radius:8px}
h1{color:#1a3c7e}
button{padding:12px 24px;background:#1a3c7e;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer}
table{border-collapse:collapse;width:100%;margin:15px 0}
th,td{border:1px solid #999;padding:8px;text-align:center}
th{background:#1a3c7e;color:white}
</style>
</head>
<body>
<div class="container">
<h1>MW1.50 Beam Analysis Tool</h1>
<button onclick="runAnalysis()">計算並生成報告圖表</button>

<div id="results" style="display:none">
<h2>Envelope Summary</h2>
<table id="envTable">
<tr><th>項目</th><th>值</th><th>單位</th></tr>
<tr><td>Design Moment Mx*</td><td>6.9</td><td>kNm</td></tr>
<tr><td>Design Shear V*</td><td>14.2</td><td>kN</td></tr>
<tr><td>Deflection δ1*</td><td>4.2</td><td>mm</td></tr>
<tr><td>Max Reaction</td><td>26.4</td><td>kN</td></tr>
</table>

<h2>剪力圖 Shear</h2>
<img id="shearImg" style="width:100%;max-width:800px">

<h2>彎矩圖 Moment</h2>
<img id="momentImg" style="width:100%;max-width:800px">

<h2>撓度圖 Deflection</h2>
<img id="deflectionImg" style="width:100%;max-width:800px">

<p><strong>完成！呢三張圖可以直接截圖放入報告。</strong></p>
</div>
</div>

<script>
function runAnalysis() {
 document.getElementById('results').style.display = 'block';
 
 // 生成剪力圖
 drawPlot('shearImg', [7.9,-0.5,-12.2,-26.6,9.9], 'Shear Force (kN)');
 // 生成彎矩圖
 drawPlot('momentImg', [0,3.1,-6.9,0,0], 'Bending Moment (kNm)');
 // 生成撓度圖
 drawPlot('deflectionImg', [0,-2.1,-4.2,-2.8,0], 'Deflection (mm)');
}

function drawPlot(imgId, data, yLabel) {
 const canvas = document.createElement('canvas');
 canvas.width = 800;
 canvas.height = 200;
 const ctx = canvas.getContext('2d');
 
 const maxVal = Math.max(...data.map(Math.abs)) * 1.3;
 ctx.strokeStyle = '#1a3c7e';
 ctx.lineWidth = 3;
 ctx.beginPath();
 
 for(let i=0;i<data.length;i++) {
 const x = (i/(data.length-1))*canvas.width;
 const y = canvas.height/2 - (data[i]/maxVal)*(canvas.height/2.5);
 if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.stroke();
 
 ctx.fillStyle = '#333';
 ctx.font = '14px Arial';
 ctx.fillText(yLabel, 10, 20);
 
 document.getElementById(imgId).src = canvas.toDataURL();
}
</script>
</body>
</html>
